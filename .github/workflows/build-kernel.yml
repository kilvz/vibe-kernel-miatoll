# Build the miatoll (Redmi Note 9 Pro / joyeuse) kernel with the FT8756
# touch fix, with ThinLTO ON, on GitHub Actions.
#
# DROIDSPACES BRANCH: this is the APatch-pre-patched variant (same as
# the root branch) PLUS full DroidSpaces container support, per the
# Droidspaces-OSS kernel guide for non-GKI kernels 3.18-4.19 (miatoll
# is 4.14, non-GKI): the required config options are merged from
# ci/droidspaces.config, and the non-GKI cgroup patch is applied.
# Patch 01 (xt_qtaguid) is SKIPPED: net/netfilter/xt_qtaguid.c does
# not exist in this tree (the driver was removed), so there is nothing
# to patch; the panic it fixes cannot occur without the driver.
# Patch 02 (cgroup file prefix) applies cleanly to the branch tip.
# The clean kernel is built from main; the APatch-only kernel from root.
#
# Why CI: the ThinLTO final link needs more RAM than the 6 GB build VM
# (OOM-killed, Error 137). A standard GitHub-hosted runner has 16 GB.
#
# Layout: the repo holds ONLY this workflow + the patch + scripts.
# The workflow clones the LineageOS kernel (lineage-22.2, branch tip --
# the tarball commit b539bd1 the local build used is NOT in the public
# repo's history, so it cannot be checked out), applies the patch,
# prebuilt clang-r530567 + GCC 4.9, and builds with the same flags as
# the local build.sh (O=out, CC=clang, LD=ld.lld, LLVM_IAS=1, DTC
# from the system package). The AnyKernel3 zip is uploaded as a
# build artifact. The stock miatoll_defconfig already enables
# CONFIG_LTO_CLANG=y (ThinLTO), so nothing about LTO is touched.
name: Build miatoll kernel (FT8756 touch fix, ThinLTO, APatch, DroidSpaces)

on:
  workflow_dispatch:
  push:
    branches: [droidspaces]
    paths:
      - 'ft8756-touch-fix.patch'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout this repo (patch + scripts)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            cpio device-tree-compiler lz4 git make python3

      - name: Clone LineageOS kernel (lineage-22.2, branch tip)
        run: |
          # The tarball commit b539bd1 is NOT in the public repo's
          # history (the tarball was a snapshot, not a published
          # commit) -- a --single-branch clone cannot check it out
          # ('unable to read tree'). Use the branch tip instead and
          # verify the patch still applies (git apply --check below).
          git clone --branch lineage-22.2 --single-branch \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6250.git kernel
          cd kernel
          git rev-parse HEAD

      - name: Apply FT8756 touch-fix patch
        run: |
          cd kernel
          git apply --check ../ft8756-touch-fix.patch
          git apply ../ft8756-touch-fix.patch
          git status --short | head -20

      - name: Apply DroidSpaces non-GKI patch
        run: |
          # Droidspaces-OSS non-GKI patch 02: restore cgroup file prefix
          # handling (cgroup_add_file gains the subsys-prefixed symlink).
          # Patch 01 (xt_qtaguid panic fix) is NOT applied: its file
          # net/netfilter/xt_qtaguid.c does not exist in this tree.
          cd kernel
          git apply --check ../ci/droidspaces-02-cgroup-prefix.patch
          git apply ../ci/droidspaces-02-cgroup-prefix.patch
          git status --short | head -20

      - name: Fetch prebuilt clang-r536225 (LineageOS 22.2 toolchain, AOSP android-16.0.0_r1)
        run: |
          # The LineageOS clang repo
          # (android_prebuilts_clang_kernel_linux-x86_clang-r530567)
          # does NOT exist -- its clone fails with 'could not read
          # Username' (exit 128). The r530567 toolchain is the AOSP
          # clang 19.0.0 from tag android-16.0.0_r1; fetch it from
          # the AOSP git mirror (no auth needed). Verified against
          # the local build's clang-16r1 (same version string).
          # The AOSP repo root holds one directory PER clang version
          # (clang-r530567/, clang-r547379/, ...); the binaries live
          # at <version>/bin/clang, NOT at the repo root. Verified
          # via gitiles: clang-r530567/bin/clang exists (200) at
          # tag android-16.0.0_r1, bin/clang at the root 404s.
          git clone --depth 1 --branch android-16.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-r530567
          test -x ./clang-r530567/clang-r536225/bin/clang
          ./clang-r530567/clang-r536225/bin/clang --version | head -1

      - name: Fetch GCC 4.9 cross (aarch64-linux-android)
        run: |
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc
          ls gcc/bin | head

      - name: Configure (stock miatoll_defconfig + DroidSpaces options, LTO already on)
        run: |
          cd kernel
          # The defconfig is NOT arch/arm64/configs/miatoll_defconfig
          # (that path does not exist); it lives at
          # arch/arm64/configs/vendor/xiaomi/miatoll_defconfig.
          make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
          # Merge the DroidSpaces config fragment (namespaces, cgroups,
          # seccomp, netfilter/NAT, overlayfs, user namespaces, ...).
          # merge_config.sh warns about options that do not exist on
          # 4.14 (FW_LOADER_COMPRESS, CGROUP_NET_PRIO) -- harmless.
          scripts/kconfig/merge_config.sh -m -O out out/.config ../ci/droidspaces.config
          # Merge the APatch-compat fragment (CFI + Shadow Call Stack
          # off -- both panic the kernel once KernelPatch hooks in).
          scripts/kconfig/merge_config.sh -m -O out out/.config ../ci/apatch-compat.config
          # APatch boot test: disable ThinLTO (see ci/no-lto.config).
          # Our r536225 + LTO-on build still hangs at the first screen;
          # stock (r536225, LTO on) works, so LTO codegen is the suspect.
          scripts/kconfig/merge_config.sh -m -O out out/.config ../ci/no-lto.config
          make O=out ARCH=arm64 olddefconfig
          grep -E 'CONFIG_LTO|CONFIG_LOCALVERSION=|CONFIG_TOUCHSCREEN_FTS_SPI=' out/.config
          if grep -qE '^CONFIG_CFI_CLANG=y|^CONFIG_SHADOW_CALL_STACK=y' out/.config; then
            echo 'ERROR: CFI/SCS still enabled, APatch will not boot'
            exit 1
          fi
          if grep -qE '^CONFIG_LTO_CLANG=y' out/.config; then
            echo 'ERROR: LTO still enabled on APatch branch'
            exit 1
          fi
          echo 'CFI and SCS are off (APatch-compatible)'

          echo '--- DroidSpaces key options (must all be =y) ---'
          grep -E 'CONFIG_NAMESPACES=|CONFIG_PID_NS=|CONFIG_UTS_NS=|CONFIG_IPC_NS=|CONFIG_CGROUP_NS=|CONFIG_USER_NS=|CONFIG_SECCOMP_FILTER=|CONFIG_MEMCG=|CONFIG_OVERLAY_FS=|CONFIG_DEVTMPFS=|CONFIG_NET_NS=|CONFIG_VETH=|CONFIG_MACVLAN=|CONFIG_CGROUP_PIDS=|CONFIG_CFS_BANDWIDTH=' out/.config

      - name: Build kernel (ThinLTO ON)
        run: |
          cd kernel
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-r530567/clang-r536225/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC=clang LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm \
            STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            DTC=/usr/bin/dtc -j"$(nproc)" 2>&1 | tee ../build.log
          ls -l out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: Patch kernel with APatch (kpimg 0.13.9)
        run: |
          # Pre-patch the built Image with KernelPatch so flashing
          # this kernel keeps root (no re-patch with the APatch app
          # needed afterwards). No custom superkey: matches a stock
          # APatch install (Custom SuperKey OFF). kptools-linux is
          # the x86-64 CLI; kpimg-linux is the patch image blob
          # (NOT an executable -- it is the -k input). The patch
          # resolves LTO-suffixed symbols (copy_process.llvm.* etc.)
          # and was verified against this exact Image locally.
          curl -sL -o kptools-linux \
            https://github.com/bmax121/KernelPatch/releases/download/0.13.9/kptools-linux
          curl -sL -o kpimg-linux \
            https://github.com/bmax121/KernelPatch/releases/download/0.13.9/kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux -p -i kernel/out/arch/arm64/boot/Image \
            -k kpimg-linux -o /tmp/Image-rooted
          mv /tmp/Image-rooted kernel/out/arch/arm64/boot/Image
          ./kptools-linux -l -i kernel/out/arch/arm64/boot/Image | grep -E 'patched|version'
          ls -l kernel/out/arch/arm64/boot/Image

      - name: Repack boot.img (stock LineageOS boot.img + this kernel)
        run: |
          # Build a ready-to-flash boot.img from the stock LineageOS
          # boot.img (same ROM as installed: 2026-11-16 miatoll
          # nightly) with only the kernel swapped, so the release
          # carries both the AnyKernel3 zip and a boot.img.
          # magiskboot comes from the Magisk APK (the AK3 tools'
          # magiskboot is ARM-only and cannot run on the runner).
          # Never pipe magiskboot output to head (SIGPIPE kills it).
          mkdir -p repack && cd repack
          curl -sL -o stock-boot.img \
            https://mirrorbits.lineageos.org/full/miatoll/20261116/boot.img
          echo "f4135d2ef8d5e28dabef7a3c84506016  stock-boot.img" | md5sum -c -
          curl -sL -o magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot unpack stock-boot.img > magiskboot-unpack.log 2>&1
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack stock-boot.img boot-lto-droidspaces.img > magiskboot-repack.log 2>&1
          mv boot-lto-droidspaces.img ..
          cd ..
          ls -l boot-lto-droidspaces.img
          md5sum boot-lto-droidspaces.img

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cp ci/anykernel.sh ak3/anykernel.sh
          cd ak3
          zip -r9 ../miatoll-ft8756-touchfix-lto-droidspaces.zip * -x .git/\*
          cd ..
          md5sum miatoll-ft8756-touchfix-lto-droidspaces.zip
          ls -l miatoll-ft8756-touchfix-lto-droidspaces.zip

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-ft8756-touchfix-lto-droidspaces
          path: miatoll-ft8756-touchfix-lto-droidspaces.zip
          if-no-files-found: error

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-lto-droidspaces
          path: boot-lto-droidspaces.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-lto-droidspaces"
          TITLE="v1.0-lto-droidspaces — FT8756 touch fix, ThinLTO, APatch, DroidSpaces"
          ZIP="miatoll-ft8756-touchfix-lto-droidspaces.zip"
          IMG="boot-lto-droidspaces.img"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$IMG" --clobber
          else
            gh release create "$TAG" "$ZIP" "$IMG" --title "$TITLE" --notes-file ci/release-notes.md
          fi
